<style>
:root{--bg:#0e1a22;--panel:#14252f;--line:#233a47;--ink:#e8eef1;--mute:#8aa2ae;--live:#ff4b3e;--sel:#1d3a49;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:340px 1fr;grid-template-rows:100%;overflow:hidden}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:16px 16px 8px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.02em}
.dot{width:10px;height:10px;border-radius:50%;background:var(--live);box-shadow:0 0 0 4px #ff4b3e33}
.tools{padding:0 16px 12px}
input[type=search]{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible,.ch:focus-visible{outline:2px solid #6cc4e8;outline-offset:2px}
.cats{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:thin}
.cats button{white-space:nowrap;background:none;border:1px solid var(--line);color:var(--mute);padding:4px 11px;border-radius:99px;cursor:pointer;font:inherit;font-size:13px}
.cats button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#list{flex:1;overflow-y:auto;padding:0 8px 8px;scrollbar-width:thin}
.ch{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;cursor:pointer;border:0;background:none;color:inherit;width:100%;text-align:left;font:inherit}
.ch:hover{background:#ffffff0d}
.ch.on{background:var(--sel)}
.ico{width:34px;height:34px;border-radius:8px;background:#fff;flex:none;display:grid;place-items:center;overflow:hidden;color:#234;font-weight:700;font-size:13px}
.ico img{width:22px;height:22px}
.ch small{color:var(--mute);display:block;font-size:12px}
.ch .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .txt{min-width:0}
.nostream{opacity:.45}
.foot{padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:8px;align-items:center}
.foot button{background:none;border:1px solid var(--line);color:var(--ink);padding:4px 10px;border-radius:6px;cursor:pointer;font:inherit;font-size:12px}
main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:18px;gap:12px}
.screen{position:relative;flex:1;min-height:0;background:#000;border-radius:14px;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
video{width:100%;height:100%;background:#000}
#msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--mute);pointer-events:none;word-break:break-all}
#msg b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
#msg.hide{display:none}
.bar{display:flex;align-items:center;gap:12px;min-height:44px}
.bar h1{margin:0;font-size:20px}
.bar .live{background:var(--live);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px}
.bar span.cat{color:var(--mute)}
.bar .sp{flex:1}
.bar button{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
.bar button:hover{background:var(--sel)}
.only{display:block;margin-top:8px;font-size:13px;color:var(--mute)}
.hint{color:var(--mute);font-size:12px}
@media(max-width:760px){body{grid-template-columns:1fr;grid-template-rows:55% 45%;}main{order:-1;padding:10px}aside{border-right:0;border-top:1px solid var(--line)}.hint{display:none}}
@media(prefers-reduced-motion:no-preference){.ch{transition:background .12s}}
</style>
</head>

</main>

    used.add(b.id);
    const mine = candidates(c), extra = bs[b.id] || [];
    if (!mine.length && extra.length) streams[c.id] = extra;
    else if (mine.length) streams[c.id] = [...mine, ...extra.filter(u => !mine.includes(u))];
    if (!c.site && b.website) c.site = b.website;
  });
  BUNDLED.channels.forEach(b => {
    if (used.has(b.id) || channels.some(c => key(c.name) === key(b.name))) return;
    const id = "b-" + b.id; streams[id] = bs[b.id];
    channels.push({id, name: b.name, category: b.category, site: b.website || "", url: ""});
  });
  channels.sort((a,b) => (!!streamFor(b)) - (!!streamFor(a)) || a.name.localeCompare(b.name, "tr"));
}
function apply(ch, sm){
  channels = normChannels(ch); streams = normStreams(sm);
  mergeBundled();
  render();
  const n = channels.filter(streamFor).length;
  $("#status").textContent = channels.length + " kanal · " + n + " yayın";
}

/* ---- Yükleme: yerel önbellek → uzak katalog ---- */
async function getJSON(name){
  const r = await fetch(BASE + "/" + name, {cache:"no-cache"});
  if (!r.ok) throw new Error(name + " " + r.status);
  return r.json();
}
async function updateCatalog(manual){
  $("#status").textContent = "Katalog denetleniyor…";
  try{
    const meta = await getJSON("metadata.json");
    const have = store.get("meta");
    const ver = JSON.stringify(meta);
    if (have === ver && store.get("channels") && !manual){ return apply(store.get("channels"), store.get("streams")); }
    const [ch, sm] = await Promise.all([getJSON("channels.json"), getJSON("stream_map.json")]);
    store.set("meta", ver); store.set("channels", ch); store.set("streams", sm);
    apply(ch, sm);
    $("#status").textContent += " · güncel";
  }catch(e){
    const c = store.get("channels");
    if (c) { apply(c, store.get("streams")); $("#status").textContent += " · çevrimdışı"; }
    else { apply(BUNDLED.channels, BUNDLED.streams); $("#status").textContent += " · yerleşik liste"; }
  }
}
$("#upd").onclick = () => updateCatalog(true);
$("#imp").onclick = () => $("#file").click();
$("#file").onchange = async e => {
  let ch = store.get("channels"), sm = store.get("streams");
  for (const f of e.target.files){
    try{
      const j = JSON.parse(await f.text());
      if (/stream/i.test(f.name)) sm = j; else if (/channel/i.test(f.name)) ch = j;
    }catch(err){ $("#status").textContent = f.name + " okunamadı"; return; }
  }
  if (ch){ store.set("channels", ch); if (sm) store.set("streams", sm); apply(ch, sm || {}); }
};

/* ---- Liste ---- */
function renderCats(){
  const cats = ["Tümü", ...new Set(channels.map(c => c.category))];
  $("#cats").innerHTML = "";
  cats.forEach(c => {
    const b = document.createElement("button");
    b.textContent = c; if (c === cat) b.className = "on";
    b.onclick = () => { cat = c; render(); };
    $("#cats").appendChild(b);
  });
}
function visible(){
  const q = query.toLocaleLowerCase("tr");
  const ok = store.get("ok"), only = $("#only").checked && ok;
  return channels.filter(c => (cat === "Tümü" || c.category === cat) && c.name.toLocaleLowerCase("tr").includes(q) && (!only || ok[c.id] === true));
}
function icon(c){
  const d = document.createElement("div"); d.className = "ico";
  const ini = c.name.trim().slice(0,2).toLocaleUpperCase("tr");
  let host = ""; try{ host = new URL(c.site).hostname; }catch(e){}
  if (host){
    const im = new Image(); im.alt = ""; im.loading = "lazy";
    im.src = "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(host) + "&sz=64";
    im.onerror = () => { d.textContent = ini; };
    d.appendChild(im);
  } else d.textContent = ini;
  return d;
}
function render(){
  renderCats();
  const list = $("#list"); list.innerHTML = "";
  const items = visible();
  if (!items.length){ list.innerHTML = '<p style="padding:16px;color:var(--mute)">Kanal bulunamadı. Aramayı veya kategoriyi değiştirin.</p>'; return; }
  items.forEach(c => {
    const b = document.createElement("button");
    b.className = "ch" + (current && current.id === c.id ? " on" : "") + (streamFor(c) ? "" : " nostream");
    b.setAttribute("role","option"); b.dataset.id = c.id;
    b.appendChild(icon(c));
    const t = document.createElement("div"); t.className = "txt";
    t.innerHTML = '<div class="nm"></div><small></small>';
    t.firstChild.textContent = c.name; t.lastChild.textContent = c.category;
    b.appendChild(t);
    b.onclick = () => play(c);
    list.appendChild(b);
  });
}
$("#q").oninput = e => { query = e.target.value; render(); };

/* ---- Oynatma ---- */
function showMsg(title, text){ const m = $("#msg"); m.className = ""; m.innerHTML = "<div><b></b><span></span></div>"; m.querySelector("b").textContent = title; m.querySelector("span").textContent = text; }
function play(c){
  current = c; store.set("last", c.id);
  $("#title").textContent = c.name; $("#ctitle").textContent = c.category; $("#liveTag").hidden = false;
  document.querySelectorAll(".ch").forEach(el => el.classList.toggle("on", el.dataset.id === c.id));
  const v = $("#v"), list = candidates(c);
  if (hls){ hls.destroy(); hls = null; }
  v.removeAttribute("src"); v.load();
  if (!list.length){ showMsg("Bu kanal için yayın adresi yok", "stream_map.json içinde “" + c.name + "” için http(s) adresi bulunamadı."); return; }
  let idx = 0, token = Symbol(); play.t = token;
  const ok = () => { if (play.t === token) $("#msg").classList.add("hide"); };
  v.onplaying = ok; v.oncanplay = ok; v.onloadeddata = ok;
  const next = why => {
    if (play.t !== token) return;
    if (hls){ hls.destroy(); hls = null; }
    idx++;
    if (idx < list.length) return start();
    const url = list[0];
    showMsg("Yayın açılamadı", why + " — " + (location.protocol === "file:" ? "Dosya doğrudan açıldığı için sunucu CORS iznini reddediyor olabilir. " : "") + "Adres: " + url);
  };
  const start = () => {
    const url = list[idx];
    showMsg("Bağlanıyor…", c.name + (list.length > 1 ? " (" + (idx+1) + "/" + list.length + ")" : ""));
    if (location.protocol === "https:" && url.startsWith("http:")) return next("Güvenli sayfadan http yayın açılamaz (karışık içerik)");
    const playIt = () => v.play().catch(e => { if (e.name === "NotAllowedError"){ v.muted = true; v.play().catch(()=>{}); } });
    const apple = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.vendor || "").includes("Apple");
    const native = v.canPlayType("application/vnd.apple.mpegurl");
    if (apple && native){
      v.onerror = () => next("Oynatıcı yayını açamadı");
      v.src = url; playIt();
    } else if (window.Hls && Hls.isSupported()){
      hls = new Hls({lowLatencyMode:false, manifestLoadingMaxRetry:1, levelLoadingMaxRetry:1, fragLoadingMaxRetry:2});
      hls.on(Hls.Events.MANIFEST_PARSED, playIt);
      hls.on(Hls.Events.ERROR, (_,d) => {
        if (!d.fatal) return;
        if (d.type === Hls.ErrorTypes.MEDIA_ERROR && !start.rec){ start.rec = 1; hls.recoverMediaError(); return; }
        const code = d.response && d.response.code;
        next("Hata: " + d.details + (code ? " (HTTP " + code + ")" : (d.type === Hls.ErrorTypes.NETWORK_ERROR ? " (ağ/CORS engeli)" : "")));
      });
      start.rec = 0;
      hls.loadSource(url); hls.attachMedia(v);
    } else if (v.canPlayType("application/vnd.apple.mpegurl")){
      v.src = url; v.onerror = () => next("Oynatıcı yayını açamadı"); playIt();
    } else showMsg("Tarayıcı HLS desteklemiyor", "Edge, Chrome veya Safari kullanın.");
  };
  start();
}
function step(d){
  const items = visible().filter(streamFor); if (!items.length) return;
  let i = items.findIndex(c => current && c.id === current.id);
  play(items[(i + d + items.length) % items.length]);
  document.querySelector(".ch.on")?.scrollIntoView({block:"nearest"});
}

/* ---- Klavye ve tam ekran ---- */
function fullscreen(){
  const sc = $(".screen"), v = $("#v");
  if (sc.requestFullscreen){ document.fullscreenElement ? document.exitFullscreen() : sc.requestFullscreen(); }
  else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
}
$("#fs").onclick = fullscreen;
addEventListener("keydown", e => {
  if (e.target.id === "q") return;
  if (e.key === "ArrowDown"){ e.preventDefault(); step(1); }
  else if (e.key === "ArrowUp"){ e.preventDefault(); step(-1); }
  else if (e.key.toLowerCase() === "f") fullscreen();
  else if (e.key.toLowerCase() === "m") $("#v").muted = !$("#v").muted;
});

/* ---- Yayın sınaması: her kanalı gerçekten açmayı dener ---- */
const APPLE = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.vendor || "").includes("Apple");
function prefer(id, u){ const cs = candidates({id, name:id, url:""}); streams[id] = [u, ...cs.filter(x => x !== u)]; }
function probe(url, ms = 10000){
  return new Promise(res => {
    const v = document.createElement("video"); v.muted = true; let h, done = false, t;
    const fin = r => { if (done) return; done = true; clearTimeout(t); try{ h && h.destroy(); }catch(e){} v.removeAttribute("src"); try{ v.load(); }catch(e){} res(r); };
    t = setTimeout(() => fin(false), ms);
    if (APPLE && v.canPlayType("application/vnd.apple.mpegurl")){ v.onloadeddata = () => fin(true); v.onerror = () => fin(false); v.src = url; }
    else if (window.Hls && Hls.isSupported()){
      h = new Hls({manifestLoadingMaxRetry:0, levelLoadingMaxRetry:0, fragLoadingMaxRetry:0});
      h.on(Hls.Events.FRAG_LOADED, () => fin(true));
      h.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) fin(false); });
      h.loadSource(url); h.attachMedia(v);
    } else fin(false);
  });
}
async function runTest(){
  if (runTest.busy) return; runTest.busy = true;
  const list = channels.filter(streamFor), ok = {}, good = {};
  let i = 0, done = 0, n = 0;
  const worker = async () => {
    while (i < list.length){
      const c = list[i++];
      for (const u of candidates(c)){
        if (location.protocol === "https:" && u.startsWith("http:")) continue;
        if (await probe(u)){ ok[c.id] = true; good[c.id] = u; prefer(c.id, u); n++; break; }
      }
      if (!ok[c.id]) ok[c.id] = false;
      done++;
      $("#status").textContent = "Sınanıyor " + done + "/" + list.length + " · " + n + " çalışıyor";
      if (done % 8 === 0){ store.set("ok", ok); render(); }
    }
  };
  await Promise.all(Array.from({length:6}, worker));
  store.set("ok", ok); store.set("good", good);
  runTest.busy = false; render();
  $("#status").textContent = n + " çalışan kanal / " + list.length + " denendi";
  if (!n) showMsg("Hiçbir yayın açılmadı", "İnternet bağlantınızı ve Windows sürümünü (CORS kısıtı olmayan) kullandığınızı kontrol edin.");
}
$("#tst").onclick = () => { store.set("ok", null); runTest(); };
$("#only").onchange = () => render();

/* ---- Başlat ---- */
(function init(){
  if (store.get("schema") !== "v3"){ ["channels","streams","meta","ok","good","last"].forEach(k => { try{ localStorage.removeItem(k); }catch(e){} }); store.set("schema","v3"); }
  apply(BUNDLED.channels, BUNDLED.streams);
  const g = store.get("good"); if (g) Object.entries(g).forEach(([id,u]) => prefer(id, u));
  render();
  const lc = channels.find(x => x.id === store.get("last"));
  if (lc){ current = lc; $("#title").textContent = lc.name; $("#ctitle").textContent = lc.category; showMsg("Son izlediğiniz: " + lc.name, "Başlatmak için kanala tıklayın."); }
  const ok = store.get("ok");
  if (ok) $("#status").textContent = Object.values(ok).filter(Boolean).length + " çalışan kanal";
  else runTest();
})();
</script>
